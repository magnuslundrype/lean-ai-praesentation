<!DOCTYPE html>
<html lang="da"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>LeanAI</title></head>
<body><script>
(async()=>{
 const parts=await Promise.all([...Array(24).keys()].map(i=>fetch('p'+i+'.txt').then(r=>{if(!r.ok)throw new Error(i+':'+r.status);return r.text()})));
 document.open();document.write(parts.join(''));document.close();
})().catch(e=>{document.body.textContent='Load error: '+e});
</script><noscript>JavaScript required.</noscript></body></html>
